[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvta-taplite-workflow"
version = "0.1.0rc2"
description = "NVTA network conversion, TAPLite assignment, QVDF smoothing, and postprocessing workflow."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Mohammad Abbas" },
]
keywords = [
  "transportation",
  "traffic-assignment",
  "taplite",
  "dtalite",
  "qvdf",
  "nvta",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.3",
  "openmatrix==0.3.5.0",
  "tqdm==4.67.3",
  "geopandas==1.1.3",
  "shapely==2.1.2",
  "fiona==1.10.1",
  "pyproj==3.7.2",
  "psutil==7.2.2",
  "taplite4mpo-pre-release==0.4.0rc1",
]

[project.optional-dependencies]
release = [
  "build>=1.3,<2",
  "twine>=6,<8",
]

[project.urls]
Homepage = "https://github.com/Mmdabb/nvta-taplite-workflow"
Repository = "https://github.com/Mmdabb/nvta-taplite-workflow"
Issues = "https://github.com/Mmdabb/nvta-taplite-workflow/issues"

[project.scripts]
nvta-taplite = "nvta_taplite_workflow.cli:main"
nvta-taplite-assignment = "nvta_taplite_workflow.assignment_cli:main"
nvta-taplite-postprocess = "nvta_taplite_workflow.postprocessing_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["nvta_taplite_workflow*"]

[tool.setuptools.package-data]
"nvta_taplite_workflow.dtalite4cube" = [
  "resources/*.csv",
  "resources/*.json",
  "resources/*/*.csv",
  "resources/*/*.json",
  "resources/*/*.npy",
  "resources/*/*.md",
  "qvdf_smoother/*.md",
]
