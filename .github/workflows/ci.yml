name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: >-
          python -m pip install --upgrade --pre --only-binary=:all: .
      - name: Test
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Doctor
        run: python -m nvta_taplite_workflow doctor
      - name: CLI smoke tests
        run: |
          python -m nvta_taplite_workflow --help
          python -m nvta_taplite_workflow assignment --help
          python -m nvta_taplite_workflow postprocess --help

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
